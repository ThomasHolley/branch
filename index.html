<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Branch</title>
    <script type="module" src="/src/main.js" defer></script>
  </head>

  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <button id="go-home" title="Aller au dossier personnel">🏠</button>
          <button id="go-up" title="Dossier parent">⬆</button>
          <span id="current-path" class="current-path"></span>
          <button id="open-settings" title="Réglages">⚙</button>
        </div>

        <div id="git-bar" class="git-bar" hidden>
          <span id="git-branch" class="git-branch"></span>
          <span id="git-ahead-behind" class="git-ahead-behind"></span>
        </div>

        <div id="git-operation" class="git-operation" hidden>
          <span id="git-operation-label"></span>
          <div class="git-operation-actions">
            <button id="git-continue">Continuer</button>
            <button id="git-abort">Annuler</button>
          </div>
        </div>

        <div id="claude-panel" class="claude-panel context-card" hidden>
          <div class="claude-panel-title">Session Claude Code</div>
          <div id="claude-branch" class="claude-branch"></div>
          <div class="claude-actions">
            <button data-slash="/clear">/clear</button>
            <button data-slash="/compact">/compact</button>
            <button data-slash="/doctor">/doctor</button>
            <button data-slash="/help">/help</button>
            <button id="claude-escape">Échap (interrompre)</button>
          </div>
          <div class="claude-panel-subtitle">Historique de cette session</div>
          <div id="claude-history" class="claude-history"></div>
        </div>

        <div id="server-panel" class="server-panel context-card" hidden>
          <div class="claude-panel-title">Serveur de dev actif</div>
          <div id="server-urls" class="server-urls"></div>
          <button id="server-stop" class="server-stop">Arrêter (Ctrl+C)</button>
        </div>

        <div id="context-panel" class="context-panel context-card" hidden>
          <div id="context-title" class="claude-panel-title"></div>
          <div id="context-detail" class="ssh-host"></div>
          <div id="context-elapsed" class="context-elapsed" hidden></div>
          <div id="context-actions" class="claude-actions"></div>
        </div>

        <div id="ssh-panel" class="ssh-panel context-card" hidden>
          <div class="claude-panel-title">Connexion SSH</div>
          <div id="ssh-host" class="ssh-host"></div>
          <div id="ssh-cwd" class="ssh-cwd" title="Dossier distant (si le shell distant envoie OSC 7)" hidden></div>
          <button id="ssh-close">Fermer la connexion</button>
        </div>

        <div class="filter-row">
          <input id="filter-input" type="text" placeholder="Rechercher dans les sous-dossiers…" />
        </div>

        <div id="browse-hint" class="browse-hint" hidden></div>

        <div id="file-tree" class="file-tree panel"></div>

        <div id="command-history" class="command-history" hidden>
          <div class="claude-panel-subtitle">Commandes récentes</div>
          <div id="command-history-list" class="command-history-list"></div>
        </div>
      </aside>
      <main class="terminal-pane">
        <div class="tab-bar">
          <div id="tab-list" class="tab-list"></div>
          <button id="new-tab" class="new-tab" title="Nouvel onglet (Ctrl+Maj+T)">+</button>
        </div>
        <div id="terminals" class="terminals"></div>
      </main>
    </div>

    <div id="context-menu" class="context-menu" hidden>
      <div class="context-menu-item" data-action="mention-claude" hidden>Mentionner dans Claude</div>
      <div class="context-menu-item" data-action="new-tab" hidden>Nouvel onglet ici</div>
      <div class="context-menu-item" data-action="open-editor">Ouvrir dans l'éditeur</div>
      <div class="context-menu-item" data-action="copy-path">Copier le chemin</div>
      <div class="context-menu-item context-menu-danger" data-action="delete">Mettre à la corbeille</div>
    </div>
    <div id="settings" class="settings-overlay" hidden>
      <div class="settings-panel" role="dialog" aria-labelledby="settings-title">
        <div class="settings-header">
          <span id="settings-title">Réglages</span>
          <button id="close-settings" title="Fermer (Échap)">×</button>
        </div>
        <div class="settings-row">
          <span class="settings-label">Taille du texte</span>
          <div class="font-size-control">
            <button id="font-smaller" title="Réduire (Cmd/Ctrl −)">−</button>
            <span id="setting-font-size"></span>
            <button id="font-larger" title="Agrandir (Cmd/Ctrl +)">+</button>
          </div>
        </div>
        <label class="settings-row">
          <span class="settings-label">Thème</span>
          <select id="setting-theme">
            <option value="dark">Sombre</option>
            <option value="light">Clair</option>
            <option value="system">Comme le système</option>
          </select>
        </label>
        <label class="settings-row">
          <span class="settings-label">Éditeur</span>
          <select id="setting-editor"></select>
        </label>
        <label class="settings-row">
          <span class="settings-label">Shell</span>
          <select id="setting-shell"></select>
        </label>
        <div class="settings-note">Le shell choisi s'applique aux nouveaux onglets.</div>
      </div>
    </div>
  </body>
</html>
